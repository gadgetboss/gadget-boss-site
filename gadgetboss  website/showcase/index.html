    // --- INTERACTIVE GLOW CARD COMPONENT ---
    // Replicates Stripe/Linear hover border glow tracking the mouse coordinates
    function GlowCard({ children, className = "", gradientColor = "rgba(197, 160, 89, 0.15)" }) {
      const cardRef = useRef(null);
      const [coords, setCoords] = useState({ x: 0, y: 0 });
      const [isHovered, setIsHovered] = useState(false);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        setCoords({
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        });
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
          className={`relative overflow-hidden rounded-2xl border border-zinc-800/40 bg-zinc-900/30 backdrop-blur-xl transition-all duration-500 hover:border-zinc-700/60 ${className}`}
        >
          {/* Radial Gradient Hover Highlight */}
          <div
            className="absolute inset-0 pointer-events-none transition-opacity duration-500 z-0"
            style={{
              opacity: isHovered ? 1 : 0,
              background: `radial-gradient(350px circle at ${coords.x}px ${coords.y}px, ${gradientColor}, transparent 80%)`
            }}
          />
          <div className="relative z-10 w-100 h-100">
            {children}
          </div>
        </div>
      );
    }

                        {/* Bar Graph */}
                        <div className="flex items-end justify-between h-40 pt-4 px-2">

                                    height: isLoaded ? `${(data.sales / 130) * 100}%` : '0%'

                              <span className="text-[10px] font-bold text-zinc-500 uppercase tracking-wide">{data.month}</span>

                            <span className="text-zinc-400 text-xs font-semibold uppercase tracking-widest block">Checkout Conversion Rate</span>

                            />

                              cx="72" 
                              cy="72" 
                              r="54" 
                              stroke="#c5a059" 
                              strokeWidth="8" 
                              fill="transparent"

                              strokeDashoffset={339.29 - (339.29 * (conversionVal / 10))}

                              style={{ transition: 'stroke-dashoffset 0.3s ease' }}

                                  <span className="text-xs font-bold text-white block">{loc.sales} ({loc.growth})</span>
                                </div>
                              )}
                            </div>
