<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GADGETBO$$ — Administrative CRM Control Center</title>
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;300;400;600;800;900&family=Plus+Jakarta+Sans:wght@200;400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Styling & CDNs -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            obsidian: {
              950: '#06070a',
              900: '#0c0d12',
              850: '#12141c',
              800: '#181b26',
              700: '#2c3145',
            },
            accent: {
              gold: {
                500: '#c5a059',
                400: '#d7b97c',
                300: '#e6d0a1',
                100: '#f7edd6',
              },
              silver: {
                500: '#94a3b8',
                400: '#cbd5e1',
                300: '#e2e8f0',
              }
            }
          },
          boxShadow: {
            'glow-gold': '0 0 25px rgba(197, 160, 89, 0.15)',
            'glow-silver': '0 0 25px rgba(203, 213, 225, 0.1)',
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #06070a;
      color: #cbd5e1;
    }
    /* Hardware accelerated smooth glowing gradients */
    .glow-spot {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(197,160,89,0.06) 0%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
    }
    /* Scrollbars customization */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0c0d12;
    }
    ::-webkit-scrollbar-thumb {
      background: #2c3145;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #c5a059;
    }
  </style>

  <!-- React 18, Babel, and Lucide Icon Scripts -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="font-sans antialiased selection:bg-accent-gold-500/20 selection:text-accent-gold-400 overflow-x-hidden min-h-screen">

  <!-- Ambient Glow Elements -->
  <div class="glow-spot top-12 left-10"></div>
  <div class="glow-spot top-[50%] right-[-100px]"></div>

  <div id="crm-root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Custom Interactive Card Wrapper
    function GlowCard({ children, gradientColor = "rgba(197, 160, 89, 0.08)", className = "" }) {
      const [coords, setCoords] = useState({ x: 0, y: 0 });
      const [isHovered, setIsHovered] = useState(false);

      const handleMouseMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        setCoords({
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        });
      };

      return (
        <div
          onMouseMove={handleMouseMove}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
          className={`relative overflow-hidden rounded-2xl border border-zinc-800/60 bg-zinc-950/60 backdrop-blur-xl transition-all duration-300 ${className}`}
          style={{
            boxShadow: isHovered ? `0 8px 30px rgba(0, 0, 0, 0.4), 0 0 15px ${gradientColor}` : 'none'
          }}
        >
          {isHovered && (
            <div
              className="absolute pointer-events-none rounded-full transition-opacity duration-300"
              style={{
                width: '180px',
                height: '180px',
                background: `radial-gradient(circle, ${gradientColor} 0%, transparent 80%)`,
                left: `${coords.x - 90}px`,
                top: `${coords.y - 90}px`,
                transform: 'translate3d(0, 0, 0)',
                zIndex: 1
              }}
            />
          )}
          <div className="relative z-10">{children}</div>
        </div>
      );
    }

    // Main App Component
    function CRMApp() {
      const [activeTab, setActiveTab] = useState("overview");
      const [connectionState, setConnectionState] = useState("loading");
      const [connectionMessage, setConnectionMessage] = useState("Connecting to CRM server...");
      
      // CRM State Hooks
      const [stats, setStats] = useState({ totalRevenue: 0, totalCustomers: 0, activeLeads: 0, averageOrderValue: 0 });
      const [customers, setCustomers] = useState([]);
      const [orders, setOrders] = useState([]);
      const [leads, setLeads] = useState([]);
      
      // Zoho Configuration States
      const [zohoConfig, setZohoConfig] = useState({ clientId: "", clientSecret: "", refreshToken: "", domain: "com", status: "Disconnected" });
      const [zohoForm, setZohoForm] = useState({ clientId: "", clientSecret: "", refreshToken: "", domain: "com" });
      const [syncingZoho, setSyncingZoho] = useState(false);
      const [configMessage, setConfigMessage] = useState("");
      
      // Fetch stats & database values
      const fetchCRMData = async () => {
        try {
          setConnectionState("loading");
          setConnectionMessage("Refreshing CRM data...");

          // Fetch analytics counts
          const statsRes = await fetch("/api/crm/stats");
          if (!statsRes.ok) throw new Error(`Stats request failed with ${statsRes.status}`);
          const statsData = await statsRes.json();
          setStats(statsData);
          
          // Fetch customer list
          const custRes = await fetch("/api/crm/customers");
          if (!custRes.ok) throw new Error(`Customer request failed with ${custRes.status}`);
          const custData = await custRes.json();
          setCustomers(custData);
          
          // Fetch orders ledger
          const ordersRes = await fetch("/api/crm/orders");
          if (!ordersRes.ok) throw new Error(`Orders request failed with ${ordersRes.status}`);
          const ordersData = await ordersRes.json();
          setOrders(ordersData);
          
          // Fetch lead activities stream
          const leadsRes = await fetch("/api/crm/leads");
          if (!leadsRes.ok) throw new Error(`Leads request failed with ${leadsRes.status}`);
          const leadsData = await leadsRes.json();
          setLeads(leadsData);

          setConnectionState("connected");
          setConnectionMessage("Server connected");
        } catch (err) {
          console.error("Error communicating with CRM Server APIs:", err);
          setConnectionState("error");
          setConnectionMessage("CRM data unavailable");
        }
      };
      
      // Fetch Zoho credentials configuration
      const fetchZohoConfig = async () => {
        try {
          const res = await fetch("/api/crm/zoho/config");
          if (!res.ok) throw new Error(`Zoho config request failed with ${res.status}`);
          const data = await res.json();
          setZohoConfig(data);
          setZohoForm({
            clientId: data.clientId || "",
            clientSecret: data.clientSecret || "",
            refreshToken: data.refreshToken || "",
            domain: data.domain || "com"
          });
        } catch (err) {
          console.error("Error reading Zoho configuration parameters:", err);
        }
      };
      
      // Initial Load and short polling intervals
      useEffect(() => {
        fetchCRMData();
        fetchZohoConfig();
        
        const pollInterval = setInterval(() => {
          fetchCRMData();
        }, 3000);
        
        return () => clearInterval(pollInterval);
      }, []);
      
      // Re-trigger lucide icons refresh after tab changes
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, customers, orders, leads, zohoConfig]);

      // Fulfill local orders status
      const handleStatusUpdate = async (orderId, newStatus) => {
        try {
          const res = await fetch("/api/crm/orders/update", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ orderId, status: newStatus })
          });
          const resData = await res.json();
          if (resData.status === "success") {
            fetchCRMData();
          }
        } catch (err) {
          console.error("Error updating order fulfillment status:", err);
        }
      };

      // Save Zoho Configuration parameters
      const handleZohoSubmit = async (e) => {
        e.preventDefault();
        setConfigMessage("Saving parameters & launching sync test...");
        try {
          const res = await fetch("/api/crm/zoho/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(zohoForm)
          });
          const resData = await res.json();
          setConfigMessage(resData.message);
          setTimeout(() => {
            fetchZohoConfig();
            fetchCRMData();
            setConfigMessage("");
          }, 2000);
        } catch (err) {
          setConfigMessage("Error updating Zoho configuration parameters.");
        }
      };

      // Force Manual Zoho CRM Sync
      const handleForceSync = async () => {
        setSyncingZoho(true);
        try {
          const res = await fetch("/api/crm/zoho/sync", { method: "POST" });
          const resData = await res.json();
          setTimeout(() => {
            fetchCRMData();
            fetchZohoConfig();
            setSyncingZoho(false);
          }, 3500);
        } catch (err) {
          setSyncingZoho(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* Dashboard Header Bar */}
          <nav className="border-b border-zinc-800/40 bg-zinc-950/80 backdrop-blur-xl sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
              <div className="flex items-center gap-3">
                <img src="../assets/logo.png" alt="Logo" className="w-8 h-8 object-contain filter drop-shadow(0_2px_8px_rgba(197,160,89,0.3))" />
                <span className="font-display font-black text-lg tracking-wider">
                  <span className="text-accent-silver-400">GADGET</span>
                  <span className="text-accent-gold-500">BO$$</span>
                  <span className="text-[10px] font-bold ml-2 bg-accent-gold-500/10 text-accent-gold-400 border border-accent-gold-500/20 px-2.5 py-0.5 rounded-full uppercase tracking-widest font-sans">CRM PORTAL</span>
                </span>
              </div>
              <div className="flex gap-4 items-center">
                <span className={`text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1.5 uppercase tracking-wider font-sans border ${
                  connectionState === "connected"
                    ? "text-emerald-400 bg-emerald-500/10 border-emerald-500/20"
                    : connectionState === "error"
                      ? "text-rose-300 bg-rose-500/10 border-rose-500/20"
                      : "text-amber-300 bg-amber-500/10 border-amber-500/20"
                }`}>
                  <span className={`w-2 h-2 rounded-full ${
                    connectionState === "connected"
                      ? "bg-emerald-400 animate-ping"
                      : connectionState === "error"
                        ? "bg-rose-400"
                        : "bg-amber-300 animate-pulse"
                  }`}></span>
                  <span>{connectionMessage}</span>
                </span>
                <a href="../" className="text-xs font-bold uppercase tracking-wider border border-zinc-800 hover:border-zinc-700 bg-zinc-900/50 text-slate-300 hover:text-white px-4 py-2 rounded-full transition-all">
                  Launch Storefront
                </a>
              </div>
            </div>
          </nav>

          {/* Main Dashboard Space */}
          <main className="max-w-7xl mx-auto w-full px-6 py-10 flex-grow">
            
            {/* KPI STATS BAR */}
            <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
              <GlowCard gradientColor="rgba(197, 160, 89, 0.12)" className="p-6">
                <div className="flex justify-between items-center mb-3 text-slate-400">
                  <span className="text-xs font-bold uppercase tracking-wider font-sans">Total Revenue</span>
                  <i data-lucide="wallet" className="w-5 h-5 text-accent-gold-500"></i>
                </div>
                <div className="font-display font-extrabold text-3xl text-white">
                  GHS {stats.totalRevenue.toLocaleString()}
                </div>
                <span className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest block mt-2">Delivered & Dispatched Order value</span>
              </GlowCard>

              <GlowCard gradientColor="rgba(203, 213, 225, 0.1)" className="p-6">
                <div className="flex justify-between items-center mb-3 text-slate-400">
                  <span className="text-xs font-bold uppercase tracking-wider font-sans">Registered Customers</span>
                  <i data-lucide="users" className="w-5 h-5 text-accent-silver-500"></i>
                </div>
                <div className="font-display font-extrabold text-3xl text-white">
                  {stats.totalCustomers} Clients
                </div>
                <span className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest block mt-2">Total profiles in SQLite ledger</span>
              </GlowCard>

              <GlowCard gradientColor="rgba(197, 160, 89, 0.12)" className="p-6">
                <div className="flex justify-between items-center mb-3 text-slate-400">
                  <span className="text-xs font-bold uppercase tracking-wider font-sans">Active Warm Leads</span>
                  <i data-lucide="sparkles" className="w-5 h-5 text-accent-gold-500"></i>
                </div>
                <div className="font-display font-extrabold text-3xl text-white">
                  {stats.activeLeads} Leads
                </div>
                <span className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest block mt-2">Searches & wishlist pinning events</span>
              </GlowCard>

              <GlowCard gradientColor="rgba(203, 213, 225, 0.1)" className="p-6">
                <div className="flex justify-between items-center mb-3 text-slate-400">
                  <span className="text-xs font-bold uppercase tracking-wider font-sans">Average Order Value</span>
                  <i data-lucide="shopping-bag" className="w-5 h-5 text-accent-silver-500"></i>
                </div>
                <div className="font-display font-extrabold text-3xl text-white">
                  GHS {stats.averageOrderValue.toLocaleString()}
                </div>
                <span className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest block mt-2">Mean size of transaction drops</span>
              </GlowCard>
            </div>

            {/* TAB SELECTION CONSOLE */}
            <div className="flex flex-wrap gap-2 border-b border-zinc-800/40 pb-4 mb-8">
              <button
                onClick={() => setActiveTab("overview")}
                className={`px-5 py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all flex items-center gap-2 ${
                  activeTab === "overview" 
                    ? "bg-accent-gold-500/10 text-accent-gold-400 border border-accent-gold-500/20 shadow-glow-gold" 
                    : "text-zinc-400 hover:text-white"
                }`}
              >
                <i data-lucide="layout-dashboard" className="w-4 h-4"></i>
                <span>Activity Feed</span>
              </button>
              
              <button
                onClick={() => setActiveTab("customers")}
                className={`px-5 py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all flex items-center gap-2 ${
                  activeTab === "customers" 
                    ? "bg-accent-silver-400/10 text-accent-silver-300 border border-accent-silver-400/20" 
                    : "text-zinc-400 hover:text-white"
                }`}
              >
                <i data-lucide="users" className="w-4 h-4"></i>
                <span>Customer Base ({customers.length})</span>
              </button>

              <button
                onClick={() => setActiveTab("orders")}
                className={`px-5 py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all flex items-center gap-2 ${
                  activeTab === "orders" 
                    ? "bg-accent-gold-500/10 text-accent-gold-400 border border-accent-gold-500/20 shadow-glow-gold" 
                    : "text-zinc-400 hover:text-white"
                }`}
              >
                <i data-lucide="package" className="w-4 h-4"></i>
                <span>Fulfillment Desk ({orders.length})</span>
              </button>

              <button
                onClick={() => setActiveTab("zoho")}
                className={`px-5 py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all flex items-center gap-2 ${
                  activeTab === "zoho" 
                    ? "bg-[#f47f20]/15 text-[#f47f20] border border-[#f47f20]/30 shadow-[0_0_15px_rgba(244,127,32,0.15)]" 
                    : "text-zinc-400 hover:text-white"
                }`}
              >
                <i data-lucide="refresh-cw" className="w-4 h-4"></i>
                <span>Zoho CRM Proxy ({zohoConfig.status})</span>
              </button>
            </div>

            {/* TAB CONTENTS PANEL */}
            <div className="min-h-[400px]">
              
              {/* --- 1. OVERVIEW / ACTIVITY FEED TAB --- */}
              {activeTab === "overview" && (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                  
                  {/* Left Column: Live Activities logs (8 Columns) */}
                  <div className="lg:col-span-8 space-y-6">
                    <div className="flex justify-between items-center mb-2">
                      <h3 className="font-display font-black text-2xl text-white uppercase tracking-tight">Live Activity Stream</h3>
                      <span className="text-[10px] font-bold text-accent-gold-400 uppercase tracking-widest animate-pulse">Syncing logs...</span>
                    </div>
                    
                    <div className="space-y-4">
                      {leads.length === 0 ? (
                        <div className="p-8 text-center text-zinc-500 border border-zinc-800/40 rounded-2xl bg-zinc-950/20">
                          No visitor activities detected. Navigate the storefront to generate searches or wishlist drops!
                        </div>
                      ) : (
                        leads.map((lead) => (
                          <GlowCard key={lead.id} gradientColor={lead.searchedProduct ? "rgba(197, 160, 89, 0.08)" : "rgba(239, 68, 68, 0.05)"} className="p-5 border border-zinc-800/40 bg-zinc-950/20">
                            <div className="flex justify-between items-start gap-4">
                              <div className="flex gap-4 items-start">
                                <div className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${
                                  lead.searchedProduct 
                                    ? "bg-accent-gold-500/10 text-accent-gold-500 border border-accent-gold-500/20" 
                                    : "bg-rose-500/10 text-rose-400 border border-rose-500/20"
                                }`}>
                                  <i data-lucide={lead.searchedProduct ? "search" : "heart"} className="w-5 h-5 m-auto"></i>
                                </div>
                                <div>
                                  <span className="font-display font-bold text-white text-base block">{lead.customerName}</span>
                                  <span className="text-zinc-400 text-sm font-light mt-1 block">
                                    {lead.searchedProduct ? (
                                      <span>Searched for product query: <strong className="text-accent-gold-400 font-semibold">"{lead.searchedProduct}"</strong></span>
                                    ) : (
                                      <span>Pinned item to Wishlist: <strong className="text-rose-400 font-semibold">"{lead.wishlistProduct}"</strong></span>
                                    )}
                                  </span>
                                  <span className="text-[10px] text-zinc-500 font-semibold uppercase mt-2 block font-sans">{lead.customerPhone} — {lead.updatedAt}</span>
                                </div>
                              </div>
                              
                              {lead.zohoId ? (
                                <span className="px-3 py-1 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] font-bold rounded-full font-sans uppercase tracking-widest flex items-center gap-1">
                                  <i data-lucide="check" className="w-3 h-3 stroke-[3px]"></i>
                                  <span>Zoho Synced</span>
                                </span>
                              ) : (
                                <span className="px-3 py-1 bg-zinc-800 border border-zinc-700 text-zinc-400 text-[10px] font-bold rounded-full font-sans uppercase tracking-widest">
                                  Pending Sync
                                </span>
                              )}
                            </div>
                          </GlowCard>
                        ))
                      )}
                    </div>
                  </div>
                  
                  {/* Right Column: Mini Zoho Dashboard Status (4 Columns) */}
                  <div className="lg:col-span-4 space-y-6 lg:sticky lg:top-24">
                    <h3 className="font-display font-black text-2xl text-white uppercase tracking-tight">Zoho Connector</h3>
                    <GlowCard gradientColor="rgba(244, 127, 32, 0.12)" className="p-6 border border-zinc-800/40">
                      <div className="flex items-center gap-4 mb-4">
                        <div className="w-12 h-12 rounded-xl bg-[#f47f20]/10 border border-[#f47f20]/20 flex items-center justify-center text-[#f47f20]">
                          <i data-lucide="refresh-cw" className="w-6 h-6 m-auto"></i>
                        </div>
                        <div>
                          <span className="text-xs font-bold text-zinc-500 uppercase tracking-widest block font-sans">Connection State</span>
                          <span className={`font-display font-bold text-base block mt-0.5 ${
                            zohoConfig.status === "Connected" ? "text-emerald-400" : "text-[#f47f20]"
                          }`}>
                            {zohoConfig.status}
                          </span>
                        </div>
                      </div>
                      <p className="text-zinc-400 text-xs font-light leading-relaxed mb-6">
                        Automatically pushes storefront buyer behaviors (search inquiries, wishlist pin actions, checkouts) to your Zoho CRM API modules.
                      </p>
                      
                      <button
                        onClick={handleForceSync}
                        disabled={syncingZoho}
                        className="w-full text-xs font-bold uppercase tracking-wider bg-zinc-900 border border-zinc-800 hover:border-zinc-700 text-white py-3 rounded-xl flex items-center justify-center gap-2 transition-all"
                      >
                        {syncingZoho ? (
                          <>
                            <span className="w-4 h-4 rounded-full border-2 border-white/30 border-t-white animate-spin"></span>
                            <span>Synchronizing Zoho...</span>
                          </>
                        ) : (
                          <>
                            <i data-lucide="zap" className="w-4 h-4 text-[#f47f20]"></i>
                            <span>Force Zoho Manual Sync</span>
                          </>
                        )}
                      </button>
                    </GlowCard>
                  </div>
                </div>
              )}

              {/* --- 2. CUSTOMERS DATABASE TABLE TAB --- */}
              {activeTab === "customers" && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center mb-2">
                    <h3 className="font-display font-black text-2xl text-white uppercase tracking-tight">E-Commerce Customer Index</h3>
                    <span className="text-xs text-zinc-400 uppercase font-semibold font-sans">{customers.length} Profiles Registered</span>
                  </div>
                  
                  <div className="overflow-x-auto rounded-2xl border border-zinc-800/40 bg-zinc-950/20 backdrop-blur-xl">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="border-b border-zinc-800/60 text-zinc-400 text-xs font-bold uppercase tracking-wider font-sans bg-zinc-950/60">
                          <th className="py-4 px-6">Name</th>
                          <th className="py-4 px-6">WhatsApp Info</th>
                          <th className="py-4 px-6">Email Address</th>
                          <th className="py-4 px-6 text-right">Lifetime Value (LTV)</th>
                          <th className="py-4 px-6">Status Type</th>
                          <th className="py-4 px-6">Zoho Profile</th>
                        </tr>
                      </thead>
                      <tbody>
                        {customers.map((cust) => (
                          <tr key={cust.id} className="border-b border-zinc-800/30 hover:bg-zinc-900/10 transition-colors text-sm">
                            <td className="py-4 px-6 font-display font-bold text-white text-base">{cust.name}</td>
                            <td className="py-4 px-6 font-sans">
                              <a 
                                href={`https://wa.me/${cust.phone}`} 
                                target="_blank"
                                className="text-accent-gold-400 hover:text-accent-gold-300 font-bold tracking-wide flex items-center gap-1.5 hover:underline"
                              >
                                <i data-lucide="message-square" className="w-4 h-4 text-accent-gold-500"></i>
                                <span>{cust.phone}</span>
                              </a>
                            </td>
                            <td className="py-4 px-6 text-zinc-400">{cust.email || "N/A"}</td>
                            <td className="py-4 px-6 text-right font-display font-black text-white text-base">
                              GHS {cust.ltv.toLocaleString()}
                            </td>
                            <td className="py-4 px-6">
                              <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider border font-sans ${
                                cust.status === "VIP" 
                                  ? "bg-accent-gold-500/10 border-accent-gold-500/30 text-accent-gold-400" 
                                  : "bg-zinc-800 border-zinc-700 text-zinc-400"
                              }`}>
                                {cust.status}
                              </span>
                            </td>
                            <td className="py-4 px-6">
                              {cust.zohoId ? (
                                <div className="flex flex-col gap-0.5">
                                  <span className="text-[10px] font-bold text-emerald-400 bg-emerald-500/5 border border-emerald-500/10 px-2 py-0.5 rounded-md w-max uppercase tracking-wider font-sans">SYNCED</span>
                                  <span className="text-[9px] text-zinc-500 block font-mono mt-0.5">{cust.zohoId}</span>
                                </div>
                              ) : (
                                <span className="text-zinc-500 text-xs">Unsynced</span>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* --- 3. ORDERS LEDGER TAB --- */}
              {activeTab === "orders" && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center mb-2">
                    <h3 className="font-display font-black text-2xl text-white uppercase tracking-tight">Fulfillment Dispatch Desk</h3>
                    <span className="text-xs text-zinc-400 uppercase font-semibold font-sans">{orders.length} Transaction Drops Logged</span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {orders.length === 0 ? (
                      <div className="md:col-span-2 p-12 text-center text-zinc-500 border border-zinc-800/40 rounded-2xl bg-zinc-950/20">
                        No orders recorded. Trigger checkout actions inside the storefront catalog to log drops!
                      </div>
                    ) : (
                      orders.map((order) => (
                        <GlowCard key={order.id} gradientColor="rgba(197, 160, 89, 0.08)" className="p-6 border border-zinc-800/40">
                          
                          {/* Order Card Header */}
                          <div className="flex justify-between items-start border-b border-zinc-800/40 pb-4 mb-4">
                            <div>
                              <span className="text-xs font-bold text-zinc-500 uppercase tracking-widest block font-sans">Order ID Reference</span>
                              <span className="font-display font-black text-white text-lg block">#GDB-{1000 + order.id}</span>
                              <span className="text-[10px] text-zinc-500 font-semibold block mt-1">{order.orderDate}</span>
                            </div>
                            <div className="text-right">
                              <span className="text-xs font-bold text-zinc-500 uppercase tracking-widest block font-sans">Total Value</span>
                              <span className="font-display font-black text-accent-gold-400 text-xl block">GHS {order.totalPrice.toLocaleString()}</span>
                            </div>
                          </div>

                          {/* Client Information */}
                          <div className="mb-4">
                            <span className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest block mb-1">Customer Profile</span>
                            <div className="flex justify-between items-center bg-zinc-900/30 border border-zinc-800/30 p-2.5 rounded-lg">
                              <span className="font-display font-bold text-white">{order.customerName}</span>
                              <a href={`https://wa.me/${order.customerPhone}`} target="_blank" className="text-xs text-accent-gold-400 font-bold flex items-center gap-1 hover:underline">
                                <i data-lucide="message-square" className="w-3.5 h-3.5 text-accent-gold-500"></i>
                                <span>{order.customerPhone}</span>
                              </a>
                            </div>
                          </div>

                          {/* Cart Items List */}
                          <div className="mb-6">
                            <span className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest block mb-2">Hardware Basket Selection</span>
                            <div className="space-y-1.5 max-h-[140px] overflow-y-auto pr-1">
                              {order.items.map((item, idx) => (
                                <div key={idx} className="flex justify-between items-center text-xs font-light py-1 border-b border-zinc-900/50">
                                  <span className="text-zinc-300 font-semibold">{item.name} <strong className="text-zinc-500 font-normal">x{item.qty}</strong></span>
                                  <span className="text-accent-silver-400 font-semibold">GHS {(item.price * item.qty).toLocaleString()}</span>
                                </div>
                              ))}
                            </div>
                          </div>

                          {/* Order Actions & Status Controls */}
                          <div className="flex flex-col md:flex-row justify-between items-center gap-4 bg-zinc-900/50 border border-zinc-800/40 p-3.5 rounded-xl">
                            <div className="w-full md:w-auto">
                              <span className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest block mb-1">Fulfillment Status</span>
                              <select
                                value={order.status}
                                onChange={(e) => handleStatusUpdate(order.id, e.target.value)}
                                className="bg-zinc-950 border border-zinc-800 hover:border-zinc-700 text-xs font-bold text-slate-300 px-3 py-1.5 rounded-lg outline-none cursor-pointer tracking-wider uppercase"
                              >
                                <option value="Pending">Pending Dispatch</option>
                                <option value="Dispatched">Dispatched</option>
                                <option value="Delivered">Delivered</option>
                              </select>
                            </div>

                            <div className="text-right w-full md:w-auto">
                              <span className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest block mb-1">Zoho Sales Sync</span>
                              {order.zohoId ? (
                                <div className="flex flex-col items-end">
                                  <span className="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-md font-sans uppercase tracking-widest">SUCCESS</span>
                                  <span className="text-[9px] text-zinc-500 font-mono mt-1">{order.zohoId}</span>
                                </div>
                              ) : (
                                <span className="text-zinc-500 text-xs font-bold uppercase tracking-wider block font-sans">Pending Sync</span>
                              )}
                            </div>
                          </div>

                        </GlowCard>
                      ))
                    )}
                  </div>
                </div>
              )}

              {/* --- 4. ZOHO CRM INTEGRATION TAB --- */}
              {activeTab === "zoho" && (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                  
                  {/* Left Column: Zoho Credentials Configurations Form (6 Columns) */}
                  <div className="lg:col-span-6 space-y-6">
                    <h3 className="font-display font-black text-2xl text-white uppercase tracking-tight">Zoho Configuration Settings</h3>
                    
                    <GlowCard gradientColor="rgba(244, 127, 32, 0.12)" className="p-6 border border-zinc-800/40">
                      <form onSubmit={handleZohoSubmit} className="space-y-4">
                        
                        <div>
                          <label className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest block mb-2 font-sans">Zoho CRM DC Domain Extension</label>
                          <select
                            value={zohoForm.domain}
                            onChange={(e) => setZohoForm({ ...zohoForm, domain: e.target.value })}
                            className="w-full bg-zinc-900/50 border border-zinc-800 text-sm rounded-lg px-4 py-3 outline-none text-white focus:border-accent-gold-500 transition-all font-semibold uppercase cursor-pointer"
                          >
                            <option value="com">zoho.com (Global US)</option>
                            <option value="eu">zoho.eu (Europe)</option>
                            <option value="in">zoho.in (India)</option>
                            <option value="com.au">zoho.com.au (Australia)</option>
                          </select>
                        </div>

                        <div>
                          <label className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest block mb-2 font-sans">Zoho CRM Client ID</label>
                          <input 
                            type="text"
                            required
                            placeholder="1000.XXXXXXXXXXXXXXXXXXXXXXXX"
                            value={zohoForm.clientId}
                            onChange={(e) => setZohoForm({ ...zohoForm, clientId: e.target.value })}
                            className="w-full bg-zinc-900/50 border border-zinc-800 text-sm rounded-lg px-4 py-3 outline-none text-white focus:border-accent-gold-500 transition-all"
                          />
                        </div>

                        <div>
                          <label className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest block mb-2 font-sans">Zoho CRM Client Secret</label>
                          <input 
                            type="password"
                            required
                            placeholder="Enter Client Secret"
                            value={zohoForm.clientSecret}
                            onChange={(e) => setZohoForm({ ...zohoForm, clientSecret: e.target.value })}
                            className="w-full bg-zinc-900/50 border border-zinc-800 text-sm rounded-lg px-4 py-3 outline-none text-white focus:border-accent-gold-500 transition-all font-mono"
                          />
                        </div>

                        <div>
                          <label className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest block mb-2 font-sans">Zoho CRM OAuth Refresh Token</label>
                          <input 
                            type="password"
                            required
                            placeholder="1000.XXXXXXXXXXXXXXXX.XXXXXXXXXXXXXXXX"
                            value={zohoForm.refreshToken}
                            onChange={(e) => setZohoForm({ ...zohoForm, refreshToken: e.target.value })}
                            className="w-full bg-zinc-900/50 border border-zinc-800 text-sm rounded-lg px-4 py-3 outline-none text-white focus:border-accent-gold-500 transition-all font-mono"
                          />
                        </div>

                        {configMessage && (
                          <div className="text-xs font-bold text-accent-gold-400 bg-accent-gold-500/10 border border-accent-gold-500/20 p-3 rounded-lg text-center font-sans">
                            {configMessage}
                          </div>
                        )}

                        <button 
                          type="submit"
                          className="w-full text-xs font-bold uppercase tracking-widest bg-accent-gold-500 hover:bg-accent-gold-400 text-obsidian-950 py-4 rounded-xl flex items-center justify-center gap-2 shadow-glow-gold hover:shadow-[0_0_35px_rgba(197,160,89,0.35)] transition-all font-sans"
                        >
                          <i data-lucide="check-square" className="w-4 h-4 stroke-[3px]"></i>
                          <span>Save Config & Test Auth Connection</span>
                        </button>

                      </form>
                    </GlowCard>
                  </div>

                  {/* Right Column: Zoho Architecture explanations (6 Columns) */}
                  <div className="lg:col-span-6 space-y-6">
                    <h3 className="font-display font-black text-2xl text-white uppercase tracking-tight">Zoho OAuth Sync Broker</h3>
                    
                    <GlowCard gradientColor="rgba(203, 213, 225, 0.08)" className="p-6 border border-zinc-800/40">
                      <div className="space-y-6">
                        <div>
                          <span className="text-xs font-bold text-zinc-500 uppercase tracking-widest block font-sans">Secure Proxy Execution</span>
                          <p className="text-zinc-400 text-sm font-light leading-relaxed mt-2">
                            API requests from browsers are blocked by Zoho due to Cross-Origin Resource Sharing (CORS) security guidelines. The GADGETBO$$ Python server acts as a high-integrity proxy broker to execute OAuth tokens safely in backend parameters without leaking details.
                          </p>
                        </div>

                        <div className="border-t border-zinc-800/40 pt-4">
                          <span className="text-xs font-bold text-zinc-500 uppercase tracking-widest block font-sans">Synchronization Routine mapping</span>
                          <ul className="space-y-3 text-xs font-light text-zinc-300 mt-3 font-sans">
                            <li className="flex gap-2.5 items-start">
                              <i data-lucide="check-circle" className="w-4 h-4 text-emerald-400 shrink-0"></i>
                              <span><strong>Storefront Customers:</strong> Automatically synced to Zoho <strong>Contacts</strong> module mapping phone & email.</span>
                            </li>
                            <li className="flex gap-2.5 items-start">
                              <i data-lucide="check-circle" className="w-4 h-4 text-emerald-400 shrink-0"></i>
                              <span><strong>Buyer Search & Wishlists:</strong> Automatically synced to Zoho <strong>Leads</strong> module with Company set to <em>"GADGETBO$$ Retail Client"</em>.</span>
                            </li>
                            <li className="flex gap-2.5 items-start">
                              <i data-lucide="check-circle" className="w-4 h-4 text-emerald-400 shrink-0"></i>
                              <span><strong>Transaction Drops:</strong> Automatically synced to Zoho <strong>Sales_Orders</strong> tracking total payable and cart details.</span>
                            </li>
                          </ul>
                        </div>

                        <div className="border-t border-zinc-800/40 pt-4 flex justify-between items-center gap-4 bg-zinc-900/30 p-4 rounded-xl">
                          <div>
                            <span className="text-xs font-bold text-zinc-500 uppercase tracking-widest block font-sans">Zoho Sync Module Status</span>
                            <span className={`text-sm font-bold block mt-1 ${
                              zohoConfig.status === "Connected" ? "text-emerald-400" : "text-[#f47f20]"
                            }`}>
                              {zohoConfig.status}
                            </span>
                          </div>

                          <button
                            onClick={handleForceSync}
                            disabled={syncingZoho}
                            className="text-xs font-bold uppercase tracking-wider border border-zinc-850 hover:border-zinc-700 bg-zinc-900/60 text-white px-4 py-2.5 rounded-xl flex items-center gap-1.5 transition-all font-sans"
                          >
                            {syncingZoho ? (
                              <span className="w-4 h-4 rounded-full border-2 border-white/30 border-t-white animate-spin"></span>
                            ) : (
                              <i data-lucide="refresh-cw" className="w-4 h-4 text-[#f47f20]"></i>
                            )}
                            <span>Manual Sync Now</span>
                          </button>
                        </div>
                      </div>
                    </GlowCard>
                  </div>

                </div>
              )}

            </div>

          </main>

          {/* CRM Footer Branding */}
          <footer className="max-w-7xl mx-auto w-full px-6 py-12 border-t border-zinc-800/40 text-center relative z-10">
            <div className="flex justify-center items-center gap-3 mb-4">
              <img src="../assets/logo.png" alt="Logo" className="w-8 h-8 object-contain filter drop-shadow(0_2px_8px_rgba(197,160,89,0.3))" />
              <span className="font-display font-black text-xl tracking-wider">
                <span className="text-accent-silver-400">GADGET</span>
                <span className="text-accent-gold-500">BO$$</span>
              </span>
            </div>
            <p className="text-xs text-zinc-500 uppercase tracking-widest font-semibold font-sans">
              © 2026 GADGETBO$$ CRM — Enterprise Lead Dispatch Management Suite. All Rights Reserved.
            </p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("crm-root"));
    root.render(<CRMApp />);
  </script>
</body>
</html>
